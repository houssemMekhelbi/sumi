# Sumi yoru terminal. Ink at 93% with a little
# compositor blur behind it; ink text, vermilion cursor line.
# Both colour sections carry the same palette so a light/dark switch keybind
# cannot pull in foot's stock colours.

[main]
font=DM Mono:size=10.5
line-height=20
pad=16x16
initial-color-theme=dark

[bell]
# A bell in a window without the focus marks it urgent, which the bar's workspace slot shows.
urgent=yes

[cursor]
style=beam
blink=no
beam-thickness=2

[colors-dark]
alpha=0.93
blur=yes
background=1D1B17
foreground=DCD5C7
cursor=1D1B17 D2492F
regular0=15130F
regular1=E0583C
regular2=8FA876
regular3=C9A860
regular4=7FA1C6
regular5=B98AA6
regular6=7DB3B0
regular7=9A9386
bright0=6B655A
bright1=EE7A5E
bright2=A9C191
bright3=DDC07E
bright4=9DBADB
bright5=CFA3BD
bright6=9CCBC8
bright7=E9E2D4
selection-foreground=E9E2D4
selection-background=2D2B26
jump-labels=15130F D2492F
scrollback-indicator=15130F BDB6A8
search-box-no-match=F3ECDF D2492F
search-box-match=15130F BDB6A8
urls=7FA1C6

