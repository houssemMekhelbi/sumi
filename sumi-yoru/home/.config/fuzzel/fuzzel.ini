# Sumi yoru launcher for fuzzel (unused: SUPER+D runs sumi-launcher, foot + fzf).

[main]
font=Instrument Sans:size=10.5,IBM Plex Sans Arabic:size=10.5
use-bold=no
prompt="›  "
placeholder=search
icons-enabled=yes
match-counter=yes
anchor=center
lines=8
width=90
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=36
layer=overlay
terminal=foot -e

[colors]
background=1D1B17F7
text=9A9386FF
message=9A9386FF
prompt=E0583CFF
placeholder=5A554CFF
input=E9E2D4FF
match=BDB6A8FF
selection=2D2B26FF
selection-text=E9E2D4FF
selection-match=E0583CFF
counter=7FA1C6FF
border=BDB6A8FF

[border]
width=1
radius=3
