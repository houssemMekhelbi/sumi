# Sumi yoru lock screen. Mostly empty paper: a brush clock and the date
# on the left, the password on a pale brush stroke under them; on the right the
# saying stands in vertical columns (tategaki, read right to left) with its
# romaji turned 90° beside it and one vermilion seal under it.
# No username. Sayings: ~/.config/hypr/sumi-yoru/sayings.txt.
# The stroke and the seal are PNGs from ~/.config/hypr/sumi-yoru/build-ink.py.

general {
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = true
}

background {
    monitor =
    path = ~/.config/hypr/sumi-yoru/wallpaper.png
    color = rgb(15130F)
    blur_passes = 1
    blur_size = 3
    brightness = 0.85
    vibrancy = 0
    noise = 0.01
}

# ---- left: clock, date, field ------------------------------------------

label {
    monitor =
    text = $TIME
    color = rgba(E9E2D4FF)
    font_size = 190
    font_family = Yuji Syuku
    position = 190, 120
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "<i>$(date +'%A, %-d %B')</i>"
    color = rgba(9A9386FF)
    font_size = 26
    font_family = Newsreader
    position = 206, -40
    halign = left
    valign = center
}

# the pale brush stroke the password sits on
image {
    monitor =
    path = ~/.config/hypr/sumi-yoru/lock-field.png
    size = 46
    rounding = 0
    border_size = 0
    position = 196, -130
    halign = left
    valign = center
    zindex = 0
}

input-field {
    monitor =
    size = 440, 46
    outline_thickness = 0
    outer_color = rgba(00000000)
    inner_color = rgba(00000000)
    font_color = rgba(E9E2D4FF)
    font_family = DM Mono
    check_color = rgba(00000000)
    fail_color = rgba(00000000)
    capslock_color = rgba(00000000)
    rounding = 0
    dots_size = 0.2
    dots_spacing = 0.6
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = <span foreground="##E0583C">›</span>   <span foreground="##9A9386">password</span>
    fail_text = <span foreground="##E0583C">$FAIL</span>
    check_text = <span foreground="##7FA1C6">verifying</span>
    zindex = 1
    position = 196, -130
    halign = left
    valign = center
}

# ---- right: the saying, tategaki -----------------------------------------
# Column 1 is the rightmost; column 2 (when the saying has one) stands to its
# left; both start at the same height. The romaji runs down beside them.

label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/sumi-lock-saying jp1
    color = rgba(E9E2D4FF)
    font_size = 80
    font_family = Yuji Syuku
    text_align = center
    position = -250, -130
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/sumi-lock-saying jp2
    color = rgba(E9E2D4FF)
    font_size = 80
    font_family = Yuji Syuku
    text_align = center
    position = -365, -130
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/sumi-lock-saying romaji
    color = rgba(9A9386FF)
    font_size = 17
    font_family = Newsreader
    rotate = 90
    position = -150, 60
    halign = right
    valign = center
}

# the seal under the saying: a vermilion imprint with 墨 in paper
image {
    monitor =
    path = ~/.config/hypr/sumi-yoru/seal.png
    size = 64
    rounding = 0
    border_size = 0
    zindex = 0
    position = 640, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = 墨
    color = rgba(F3ECDFFF)
    font_size = 30
    font_family = Yuji Syuku
    zindex = 1
    position = 640, -120
    halign = center
    valign = center
}

# ---- footer --------------------------------------------------------------

label {
    monitor =
    text = <span letter_spacing='4000'>SUMI</span>
    color = rgba(5A554CFF)
    font_size = 9
    font_family = DM Mono
    position = 206, 40
    halign = left
    valign = bottom
}
