general {
    lock_cmd = $HOME/.local/bin/hattin-lock
    before_sleep_cmd = $HOME/.local/bin/hattin-lock
}

# Lock after five minutes, unless a remote SSH client is actively connected.
# Deliberately no DPMS or suspend listener because display power cycling is
# deferred until multi-GPU wake behavior is proven.
listener {
    timeout = 300
    on-timeout = $HOME/.local/bin/lock-unless-ssh-active
}
