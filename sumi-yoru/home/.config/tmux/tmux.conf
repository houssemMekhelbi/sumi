# Sumi yoru tmux. Status at the bottom on the terminal's own paper with a
# hairline above it (the pane border). Session name in a solid ink block
# ("墨 name"), windows as plain index:name with the current one underlined in
# vermilion, the clock in muted ink on the right. No powerline slants: a brush
# end cannot be drawn in a cell, so the blocks stay square.

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,alacritty*:RGB,xterm-ghostty:RGB,xterm-256color:RGB"
set -as terminal-features ",foot*:usstyle,alacritty*:usstyle,xterm-ghostty:usstyle"

# One status line in tmux's stock layout. Another theme (Nordschleife) runs two lines with its own
# status-format; a running server keeps those across a theme switch unless they are reset here.
set -g status on
set -gu status-format


set -g status-position bottom
set -g status-interval 15
set -g status-justify left
set -g status-style "bg=default,fg=#9A9386"

set -g status-left-length 40
set -g status-left "#[bg=#BDB6A8,fg=#15130F,bold] 墨 #{=/24/…:session_name} #[default]  "

set -g status-right-length 40
set -g status-right "#[fg=#9A9386]%d %b  %H:%M "

set -g window-status-separator "  "
set -g window-status-format "#[fg=#9A9386]#I:#W#{?window_activity_flag,#[fg=#7FA1C6] •,}"
set -g window-status-current-format "#[fg=#E9E2D4,bold,underscore,us=#D2492F]#I:#W#[nounderscore]"
set -g window-status-activity-style "none"
set -g monitor-activity on
set -g visual-activity off

# Pane borders: active ink, inactive sei.
set -g pane-border-lines single
set -g pane-border-style "fg=#332f29"
set -g pane-active-border-style "fg=#bdb6a8"
set -g pane-border-indicators off

set -g message-style "bg=#2D2B26,fg=#E9E2D4"
set -g message-command-style "bg=#2D2B26,fg=#E0583C"
set -g mode-style "bg=#2D2B26,fg=#E9E2D4"
set -g copy-mode-match-style "bg=#2D2B26,fg=#7FA1C6,underscore"
set -g copy-mode-current-match-style "bg=#2D2B26,fg=#E0583C,underscore"
set -g menu-style "bg=#1D1B17,fg=#E9E2D4"
set -g menu-selected-style "bg=#2D2B26,fg=#E9E2D4"
set -g menu-border-style "fg=#BDB6A8"
set -g menu-border-lines single
set -g popup-border-style "fg=#BDB6A8"
set -g popup-border-lines single
set -g display-panes-colour "#332F29"
set -g display-panes-active-colour "#D2492F"
set -g clock-mode-colour "#E9E2D4"
