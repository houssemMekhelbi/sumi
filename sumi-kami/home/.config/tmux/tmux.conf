# Sumi kami tmux. Status at the bottom on the terminal's own paper with a
# hairline above it (the pane border). Session name in a solid ink block
# ("墨 name"), windows as plain index:name with the current one underlined in
# vermilion, the clock in muted ink on the right. No powerline slants: a brush
# end cannot be drawn in a cell, so the blocks stay square.

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,alacritty*:RGB,xterm-ghostty:RGB,xterm-256color:RGB"
set -as terminal-features ",foot*:usstyle,alacritty*:usstyle,xterm-ghostty:usstyle"

# One status line in tmux's stock layout. Another theme (Nordschleife) runs two lines with its own
# status-format; a running server keeps those across a theme switch unless they are reset here.
set -g status on
set -gu status-format


set -g status-position bottom
set -g status-interval 15
set -g status-justify left
set -g status-style "bg=default,fg=#66615A"

set -g status-left-length 40
set -g status-left "#[bg=#3A3733,fg=#EEE8DC,bold] 墨 #{=/24/…:session_name} #[default]  "

set -g status-right-length 40
set -g status-right "#[fg=#66615A]%d %b  %H:%M "

set -g window-status-separator "  "
set -g window-status-format "#[fg=#66615A]#I:#W#{?window_activity_flag,#[fg=#2E4A6B] •,}"
set -g window-status-current-format "#[fg=#16140F,bold,underscore,us=#C8412B]#I:#W#[nounderscore]"
set -g window-status-activity-style "none"
set -g monitor-activity on
set -g visual-activity off

# Pane borders: active ink, inactive sei.
set -g pane-border-lines single
set -g pane-border-style "fg=#d6cfc2"
set -g pane-active-border-style "fg=#3a3733"
set -g pane-border-indicators off

set -g message-style "bg=#E4E0D8,fg=#16140F"
set -g message-command-style "bg=#E4E0D8,fg=#B3371F"
set -g mode-style "bg=#E4E0D8,fg=#16140F"
set -g copy-mode-match-style "bg=#E4E0D8,fg=#2E4A6B,underscore"
set -g copy-mode-current-match-style "bg=#E4E0D8,fg=#B3371F,underscore"
set -g menu-style "bg=#F6F2EA,fg=#16140F"
set -g menu-selected-style "bg=#E4E0D8,fg=#16140F"
set -g menu-border-style "fg=#3A3733"
set -g menu-border-lines single
set -g popup-border-style "fg=#3A3733"
set -g popup-border-lines single
set -g display-panes-colour "#D6CFC2"
set -g display-panes-active-colour "#C8412B"
set -g clock-mode-colour "#16140F"
