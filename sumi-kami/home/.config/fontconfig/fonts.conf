<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Sumi type:
       brush      Yuji Syuku           lock clock, sayings, seal characters (Japanese + digits)
       display    Newsreader           + Amiri (Arabic), Yuji Syuku (Japanese)
       interface  Instrument Sans      + IBM Plex Sans Arabic, Yuji Syuku
       data       DM Mono              + IBM Plex Sans Arabic, JetBrains Mono Nerd Font, Yuji Syuku
     <accept> puts the companion directly after the Latin face, so only glyphs
     the Latin face lacks use it. DM Mono has no powerline/Nerd glyphs;
     JetBrains Mono Nerd Font supplies them. ● ○ ◌ come from Noto Sans Symbols 2
     / DejaVu Sans Mono further down. -->
<fontconfig>
  <alias binding="same">
    <family>Instrument Sans</family>
    <accept><family>IBM Plex Sans Arabic</family><family>Yuji Syuku</family></accept>
  </alias>
  <alias binding="same">
    <family>Newsreader</family>
    <accept><family>Amiri</family><family>Yuji Syuku</family></accept>
  </alias>
  <alias binding="same">
    <family>DM Mono</family>
    <accept><family>IBM Plex Sans Arabic</family><family>JetBrainsMono Nerd Font</family><family>Yuji Syuku</family></accept>
  </alias>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Instrument Sans</family>
      <family>IBM Plex Sans Arabic</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Newsreader</family>
      <family>Amiri</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>DM Mono</family>
      <family>JetBrainsMono Nerd Font</family>
      <family>IBM Plex Sans Arabic</family>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
      <family>Yuji Syuku</family>
    </prefer>
  </alias>
</fontconfig>
