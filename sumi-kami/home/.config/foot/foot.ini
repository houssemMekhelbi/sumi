# Sumi kami terminal. Paper at 96% with a little
# compositor blur behind it; ink text, vermilion cursor line.
# Both colour sections carry the same palette so a light/dark switch keybind
# cannot pull in foot's stock colours.

[main]
font=DM Mono:size=10.5
line-height=20
pad=16x16
initial-color-theme=light

[bell]
# A bell in a window without the focus marks it urgent, which the bar's workspace slot shows.
urgent=yes

[cursor]
style=beam
blink=no
beam-thickness=2

[colors-dark]
alpha=0.96
blur=yes
background=F6F2EA
foreground=1F1D19
cursor=F6F2EA C8412B
regular0=16140F
regular1=B3371F
regular2=4F6B3A
regular3=8A6A1F
