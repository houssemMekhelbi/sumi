# Sumi kami launcher for fuzzel (unused: SUPER+D runs sumi-launcher, foot + fzf).

[main]
font=Instrument Sans:size=10.5,IBM Plex Sans Arabic:size=10.5
use-bold=no
prompt="›  "
placeholder=search
icons-enabled=yes
match-counter=yes
anchor=center
lines=8
width=90
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=36
layer=overlay
terminal=foot -e

[colors]
background=F6F2EAF7
text=66615AFF
message=66615AFF
prompt=B3371FFF
placeholder=A39B8CFF
input=16140FFF
match=3A3733FF
selection=E4E0D8FF
selection-text=16140FFF
selection-match=B3371FFF
counter=2E4A6BFF
border=3A3733FF

[border]
width=1
radius=3
